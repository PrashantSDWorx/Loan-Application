<div #scrollContainer class="d-flex flex-column flex-grow-1 overflow-y-hidden"
    style="background-color: var(--bs-brutal-light);">
    <app-scroll-snap-section (scrollEvent)="scrollToDetails()" [sectionTitle]="'LOAN OVERVIEW'">
        <app-loan-stats class="dashboard-card col-12 order-1 order-md-2 col-md-4" />
        <app-loan-table (createButtonClickEvent)="loanApplicationModal?.open()" (loanSelectEvent)="scrollToDetails()"
            class="dashboard-card col-12 order-2 order-md-1 col-md-8" />
        <app-loan-application-modal #loanApplicationModal class="position-absolute" />
    </app-scroll-snap-section>

    <app-scroll-snap-section (scrollEvent)="scrollToTop()" [sectionTitle]="'SELECTED APPLICATION'"
        [sectionSubtitle]="'LOAN DETAILS'" [enableScrollToTop]="true">
        <app-loan-details class="dashboard-card col-md-8">
        </app-loan-details>
        <app-repayment-list class="dashboard-card col-md-4"
            [loanApplication]="loanApplicationStore.selectedLoanApplication()" />
    </app-scroll-snap-section>
</div>
