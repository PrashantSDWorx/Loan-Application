<div #scrollContainer class="dashboard-page d-flex flex-column flex-grow-1 overflow-y-hidden"
    style="background-color: var(--bs-brutal-light);">
    <app-scroll-section (scrollEvent)="scrollToDetails()" [sectionTitle]="'LOAN OVERVIEW'">
        <app-loan-stats class="dashboard-stats dashboard-card col-12 order-1 order-xl-2 col-xl-4" />
        <app-loan-table (createButtonClickEvent)="loanApplicationModal?.open()" (loanSelectEvent)="scrollToDetails()"
            class="dashboard-table dashboard-card col-12 order-2 order-xl-1 col-xl-8" />
        <app-loan-application-modal #loanApplicationModal class="position-absolute" />
    </app-scroll-section>

    <app-scroll-section (scrollEvent)="scrollToTop()" [sectionTitle]="'SELECTED APPLICATION'"
        [sectionSubtitle]="'LOAN DETAILS'" [enableScrollToTop]="true">
        <app-loan-details class="dashboard-loan-details dashboard-card col-xl-8">
        </app-loan-details>
        <app-repayment-list class="dashboard-schedule dashboard-card col-xl-4 mt-3 mt-xl-4"
            [loanApplication]="loanApplicationStore.selectedLoanApplication()" />
        <div class="d-inline d-md-none" style="height: 0.1rem;"></div>
    </app-scroll-section>
</div>
